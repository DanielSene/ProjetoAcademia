<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema da Academia</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Ícones FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">

  <div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar bg-secondary text-white p-3" style="min-width: 220px; min-height: 100vh;">
      <h2 class="text-center mb-4">🏋️ Academia</h2>

      <div class="menu-item py-2 px-3 rounded mb-2 bg-dark text-white" onclick="loadPage('aluno')"
        style="cursor:pointer;">
        <i class="fa fa-user"></i> Alunos
      </div>

      <div class="menu-item py-2 px-3 rounded mb-2 bg-dark text-white" onclick="loadPage('aulas')"
        style="cursor:pointer;">
        <i class="fa fa-book"></i> Aulas
      </div>

      <div class="menu-item py-2 px-3 rounded mb-2 bg-dark text-white" onclick="loadPage('planos')"
        style="cursor:pointer;">
        <i class="fa fa-tags"></i> Planos
      </div>

      <div class="menu-item py-2 px-3 rounded mb-2 bg-dark text-white" onclick="loadPage('funcionarios')"
        style="cursor:pointer;">
        <i class="fa fa-users"></i> Funcionários
      </div>

      <!-- NOVA ABA ADICIONADA -->
      <div class="menu-item py-2 px-3 rounded mb-2 bg-dark text-white" onclick="loadPage('avaliacao')"
        style="cursor:pointer;">
        <i class="fa-solid fa-heart-pulse"></i> Avaliação Física
      </div>

    </div>


    <!-- Conteúdo Principal -->
    <div class="main flex-grow-1 p-4" id="content">
      <h1 class="title text-info fw-bold">Bem-vindo ao Sistema da Academia</h1>

      <div class="card bg-secondary text-light mt-4 p-4 shadow">
        <h3>Selecione uma opção no menu ao lado.</h3>
        <p>O conteúdo aparecerá aqui.</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Seu JS -->
  <script src="script.js"></script>

</body>

</html>
